name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile Python
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m compileall -q scripts tests
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m unittest discover -s tests -v
      - name: Validate JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
      - name: Reject likely committed secrets
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AZURE_CLIENT_SECRET[[:space:]]*=)' -- ':!*.md'; then
            echo 'Potential secret detected.' >&2
            exit 1
          fi
      - name: Compile Bicep without Azure authentication
        run: |
          set -euo pipefail
          az bicep version
          az bicep build --file infra/bicep/main.bicep --outfile "$RUNNER_TEMP/bootstrap.json"
          az bicep build --file infra/bicep/aihub/main.bicep --outfile "$RUNNER_TEMP/aihub.json"
